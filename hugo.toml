baseURL = "https://69f1e5a9d6a09a0f8cc2fbd5--classy-cobbler-f48e70.netlify.app/"
languageCode = "en-us"
title = "BioHacking Recovery"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "Evidence-based guides on cold plunge, red light therapy, NAD supplements, and biohacking recovery tools."
  keywords = ["cold plunge", "red light therapy", "NAD supplement", "biohacking", "recovery", "cold tub", "infrared therapy"]
  author = "BioHacking Recovery Team"
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true

  [params.homeInfoParams]
    Title = "🔬 BioHacking Recovery"
    Content = "Evidence-based guides on cold plunge therapy, red light therapy, NAD+ supplements, and the latest biohacking recovery tools. Science-backed reviews and buying guides to optimize your recovery."

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/crazyjtt11"

  [params.label]
    text = "BioHacking Recovery"
    icon = "🔬"

  [params.assets]
    disableFingerprinting = true

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    identifier = "cold-plunge"
    name = "🧊 Cold Plunge"
    url = "/categories/cold-plunge/"
    weight = 10
  [[menu.main]]
    identifier = "red-light"
    name = "🔴 Red Light Therapy"
    url = "/categories/red-light-therapy/"
    weight = 20
  [[menu.main]]
    identifier = "nad"
    name = "💊 NAD Supplements"
    url = "/categories/nad-supplements/"
    weight = 30
  [[menu.main]]
    identifier = "reviews"
    name = "⭐ Reviews"
    url = "/categories/reviews/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "🔍 Search"
    url = "/search/"
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
