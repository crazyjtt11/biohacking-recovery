<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== GLOBAL UPGRADE ===== */
:root {
  --primary: #0ea5e9;
  --primary-dark: #0284c7;
  --accent: #8b5cf6;
  --bg-hero: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  --bg-card: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
  --radius: 12px;
  --radius-lg: 16px;
}

.dark {
  --bg-card: #1e293b;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: #334155;
}

body, .post-content, .nav, .hero {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
}

/* ===== HERO SECTION ===== */
.hero {
  background: var(--bg-hero) !important;
  padding: 80px 0 60px !important;
  margin: 0 !important;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 30% 50%, rgba(14,165,233,0.15) 0%, transparent 50%),
              radial-gradient(circle at 70% 50%, rgba(139,92,246,0.1) 0%, transparent 50%);
  pointer-events: none;
}

.hero h1 {
  font-size: 2.8rem !important;
  font-weight: 800 !important;
  color: #ffffff !important;
  letter-spacing: -0.03em;
  margin-bottom: 16px !important;
  position: relative;
  z-index: 1;
  line-height: 1.2 !important;
}

.hero p {
  color: #cbd5e1 !important;
  font-size: 1.15rem !important;
  line-height: 1.7;
  max-width: 650px;
  position: relative;
  z-index: 1;
}

/* ===== NAVIGATION ===== */
.nav {
  background: rgba(255,255,255,0.95) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.dark .nav {
  background: rgba(15,23,42,0.95) !important;
}

.nav a {
  font-weight: 600 !important;
  font-size: 0.9rem;
  transition: color 0.2s;
}

.nav a:hover {
  color: var(--primary) !important;
}

/* ===== ARTICLE CARDS ===== */
.post-entry {
  background: var(--bg-card) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-lg) !important;
  padding: 28px 32px !important;
  margin-bottom: 24px !important;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  box-shadow: var(--shadow-sm) !important;
  position: relative;
  overflow: hidden;
}

.post-entry::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  opacity: 0;
  transition: opacity 0.3s;
}

.post-entry:hover {
  transform: translateY(-3px) !important;
  box-shadow: var(--shadow-xl) !important;
  border-color: var(--primary) !important;
}

.post-entry:hover::before {
  opacity: 1;
}

.post-entry h2 {
  font-size: 1.4rem !important;
  font-weight: 700 !important;
  color: var(--text-primary) !important;
  margin-bottom: 10px !important;
  letter-spacing: -0.02em;
}

.post-entry h2 a {
  color: var(--text-primary) !important;
  text-decoration: none !important;
  transition: color 0.2s;
}

.post-entry h2 a:hover {
  color: var(--primary) !important;
}

.post-entry .entry-content p {
  color: var(--text-secondary) !important;
  font-size: 0.95rem;
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.post-entry .post-meta {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.post-entry .post-meta span {
  font-size: 0.82rem;
  color: var(--text-secondary) !important;
}

.post-entry .post-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.post-entry .post-tags a {
  background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(139,92,246,0.1)) !important;
  color: var(--primary) !important;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 600;
  text-decoration: none !important;
  transition: all 0.2s;
  border: 1px solid rgba(14,165,233,0.2);
}

.post-entry .post-tags a:hover {
  background: var(--primary) !important;
  color: #ffffff !important;
}

/* ===== ARTICLE PAGE ===== */
.post-content {
  font-size: 1.05rem;
  line-height: 1.8;
}

.post-content h2 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-top: 40px;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}

.post-content h3 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-top: 28px;
  margin-bottom: 12px;
}

.post-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.post-content table th {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #ffffff;
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 0.9rem;
}

.post-content table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 0.92rem;
}

.post-content table tr:nth-child(even) {
  background: rgba(14,165,233,0.03);
}

.post-content table tr:hover {
  background: rgba(14,165,233,0.08);
}

.post-content blockquote {
  border-left: 4px solid var(--primary);
  background: rgba(14,165,233,0.05);
  padding: 16px 20px;
  margin: 20px 0;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-style: italic;
  color: var(--text-secondary);
}

.post-content strong {
  color: var(--primary-dark) !important;
  font-weight: 700;
}

.dark .post-content strong {
  color: var(--primary) !important;
}

/* ===== STATS BAR ===== */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 40px;
  padding: 24px 0;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* ===== FOOTER ===== */
footer.footer {
  background: var(--bg-hero) !important;
  color: #94a3b8 !important;
  padding: 40px 0 !important;
  margin-top: 60px;
}

footer.footer a {
  color: #cbd5e1 !important;
}

footer.footer a:hover {
  color: var(--primary) !important;
}

/* ===== BACK TO TOP ===== */
.back-to-top {
  background: var(--primary) !important;
  color: #ffffff !important;
  border-radius: 50% !important;
  width: 44px !important;
  height: 44px !important;
  display: flex !important;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg) !important;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero {
    padding: 50px 20px 40px !important;
  }
  .hero h1 {
    font-size: 1.8rem !important;
  }
  .post-entry {
    padding: 20px !important;
  }
  .post-entry h2 {
    font-size: 1.15rem !important;
  }
}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.post-entry {
  animation: fadeInUp 0.4s ease-out;
}

.post-entry:nth-child(2) { animation-delay: 0.1s; }
.post-entry:nth-child(3) { animation-delay: 0.2s; }
.post-entry:nth-child(4) { animation-delay: 0.3s; }
.post-entry:nth-child(5) { animation-delay: 0.4s; }
.post-entry:nth-child(6) { animation-delay: 0.5s; }
</style>
